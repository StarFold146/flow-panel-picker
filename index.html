<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Spectral Panel Picker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Runs app.py in the browser with stlite (no server needed).
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
      // bump on every release so browsers don't mix new and cached old files
      const v = "2026-11-13a";
      mount(
        {
          requirements: ["plotly", "jinja2", "openpyxl"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: `./app.py?v=${v}` },
            "panel.py": { url: `./panel.py?v=${v}` },
            "export.py": { url: `./export.py?v=${v}` },
            "data/signatures.csv": { url: `./data/signatures.csv?v=${v}` },
          },
          streamlitConfig: { "client.toolbarMode": "viewer" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
